services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 2s
      retries: 30

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OPSPILOT_STAGE: beta
      OPSPILOT_INDEX: postgres
      DATABASE_URL: postgresql://opspilot:opspilot@db:5432/opspilot
      OPSPILOT_LLM_PROVIDER: ${OPSPILOT_LLM_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
